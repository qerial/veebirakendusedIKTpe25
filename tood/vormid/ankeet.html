<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vormid ja nupud HTML keeles</title>
</head>
<body>
<h1>Sportlase ankeet</h1>
<form action="#">
    <table border="1">
        <tr>
            <td>
                <!--tekstikast -->
                <label for="nimi">Sisesta oma nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi">
            </td>
        </tr>

        <tr>
            <td>
                <br>
                <strong>Vali sugu:</strong>
                <br>
            </td>
            <td>
                <!-- radionupp - ainult üks valik on õige -->
                <input type="radio" name="sugu" id="naine">
                <label for="naine">naine</label>
                <br>
                <input type="radio" name="sugu" id="mees">
                <label for="mees">mees</label>
                <br>
                <input type="radio" name="sugu" id="muu">
                <label for="muu">muu</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <fieldset>
                    <legend>
                        <strong>Spordialad:</strong>
                    </legend>
                    <br>
                    <input type="checkbox" name="spordiala" id="jooksmine">
                    <label for="jooksmine">jooksmine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="ujumine">
                    <label for="ujumine">ujumine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="uisutamine">
                    <label for="uisutamine">uisutamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="suusatamine">
                    <label for="suusatamine">suusatamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="jalgpall">
                    <label for="jalgpall">jalgpall</label>
                </fieldset>
            </td>
        </tr>

        <tr>
            <td>
                <!-- arvud number -->
                <label for="tund">Mitu tundi nädalas sina teed trenni</label>
            </td>
            <td>
                <input type="number" min="0" max="24" step="1" value="0" id="tund">
            </td>
        </tr>

        <tr>
            <td>
                <!-- rippmenüü -dropdownlist -->
                <label for="klubi">Mis klubi sa külastad?</label>
            </td>
            <td>

                <select name="klubi" id="klubi">
                    <option value="vali">vali...</option>
                    <option value="gym">GYM</option>
                    <option value="myfitness">myfitness</option>
                    <option value="gym25">GYM24</option>
                    <option value="kalevspa">KalevSPA</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label for="varv"> Mis värvi tossud sul on?</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>

        <tr>
            <td>
                <label for="kuupaev">Millal oli su viimane trenn?</label>
            </td>
            <td>
            <input type="date" id="kuupaev" min="2026-b1-b1" max="2026-12-31">
            </td>
        </tr>
        <tr>
            Kasuta w3schools ja proovi ise input type=tel, file, password, valid ise 5 erineva tk
            <td>
                <label for="time"> Mis kell tavaliselt jõusaalis käid?</label>
            </td>
            <td>
                <input type="time" id="time" min="07:00" max="14:00">
            </td>
        </tr>
        <tr>
            <td>
                <label for="telefon">Sisesta Enda telefoni number</label>
            </td>
            <td>
                <input type="tel" id="telefon">
            </td>
        </tr>
        <tr>
            <td>
            <label for="fail"> Vali Fail</label>
            </td>
            <td>
                <input type="file" id="fail">
            </td>
        </tr>
        <tr>
            <td>
                <label for="parool">Sisesta enda parool</label>
            </td>
            <td>
                <input type="password" id="parool">
            </td>
        </tr>
        <tr>
            <td>
                <label for="eelistus">Millist sa neist eelistad?</label>
            </td>
            <td>
                <select name="eelistus" id="eelistus">
                <option value="vali">vali...</option>
                <option value="kangi">kangi</option>
                <option value="hantleid">hantleid </option>
                <option value="masinaid">masinaid</option>
                </select>
            </td>
        </tr>

    </table>

</form>

</body>
</html>
