<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Majakaart</title>
    <link rel="stylesheet" href="MapStyle.css">
</head>

<body>

<h1>Lehel on kasutatud map area käsud</h1>

<h2>Palun kliki hiirega erinevale alale pildil</h2>

<!-- Pilt, millele on ühendatud map -->
<img src="paremvaikemaja.png"
     alt="Ilus majake"
     usemap="#majakaart">

<!-- Kaart ehk klikitavad alad -->
<map name="majakaart">

    <!-- Ring: x, y, raadius -->
    <area
            shape="circle"
            coords="261,55,50"
            href="Sun.html"
            alt="Päike">

    <!-- Ristkülik: x1, y1, x2, y2 -->
    <area
            shape="rect"
            coords="138,179,170,231"
            href="Uks.html"
            alt="Uks">

    <!-- Polügoon: x,y punktid -->
    <area
            shape="poly"
            coords="48,145,154,82,284,144"
            href="Katus.html"
            alt="Katus">
    <area shape="rect" coords="92,163,123,194" href="aken.html" alt="aken">
    <area shape="rect" coords="4,122,32,188" href="lill.html" alt="lill">
    <area shape="rect" coords="185,164,214,193" href="aken2.html" alt="aken2">

</map>

<div id="selgitus">
    <strong>Katus</strong>
    <br>
    <br>
    Katus on ehitise ülemine osa, mis koosneb eri materjalidest
    ja konstruktsioonilistest elementidest ning toetub ehitise
    seintele ja tugedele.

    <img src="Roof.png" alt="">
</div>
<li>
    <a href="../../lingid.html">Tagasi kodulehele</a>

</li>
</body>
</html>
