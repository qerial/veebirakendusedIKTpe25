<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabeliStyle.css">
    <link rel="stylesheet" href="lipudStyle.css">
    https://www.rngdle.com/
</head>
<body>
<h1>Tabelid HTML-keeles</h1>
<h2>kõige lihtsam tabel</h2>
</body>
<table id="sinine">
    <!-- 1.rida-->
<tr>
    <td>1</td>
    <td>2</td>
</tr>
    <!-- 2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>
<h2>Natuke keerulisem tabel</h2>
<table id="punane">
    <caption>Tabel 2.</caption>
    <!-- 1.rida-->
    <tr>
        <td colspan="2">1</td>
    </tr>
    <!-- 2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>
<h2>Veel üks natuke keerulisem tabel</h2>
<table id="roheline">
    <caption>Tabel 3</caption>
    <!-- 1.rida-->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
    </tr>
    <!-- 2.rida-->
    <tr>
        <td>4</td>
    </tr>
</table>

<table id="pink">
    <caption>Tabel 4</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="4">A</td>
        <td colspan="3">B</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td colspan="2">C</td>
        <td>D</td>
    </tr>
    <!--3.rida-->
    <tr>
        <td>E</td>
        <td>F</td>
        <td rowspan="2">J</td>
    </tr>
    <!--4.rida-->
    <tr>
        <td>G</td>
        <td>I</td>
    </tr>
</table>
<h2>Lipud</h2>
<table id="eesti">
<caption> Eesti lipp</caption>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
</table>
</html>
